    <path d="M172 114 L190 130 L208 114" />
    <path d="M292 30 L310 46 L328 30" />
    <path d="M292 58 L310 74 L328 58" />
    <path d="M292 86 L310 102 L328 86" />
    <path d="M292 114 L310 130 L328 114" />
    <path d="M412 30 L430 46 L448 30" />
    <path d="M412 58 L430 74 L448 58" />
    <path d="M412 86 L430 102 L448 86" />
    <path d="M412 114 L430 130 L448 114" />
