<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-label="Akwete ikat weaving pattern in amber, ochre and cream.">
  <title>Akwete weaving pattern</title>
  <defs>
    <linearGradient id="akwete-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>
  <rect width="480" height="160" fill="url(#akwete-bg)" />
  <!-- ikat warp stripes -->
