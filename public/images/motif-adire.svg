<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-label="Adire resist-dye textile pattern in indigo and white.">
  <title>Adire textile weave</title>
  <defs>
    <linearGradient id="adire-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="55%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect width="480" height="160" fill="url(#adire-bg)" />
  <g fill="#e0e7ff" opacity="0.9">
    <!-- concentric resist rings -->
    <g>
      <circle cx="40" cy="40" r="26" fill="none" stroke="#e0e7ff" stroke-width="3" />
      <circle cx="40" cy="40" r="15" fill="none" stroke="#e0e7ff" stroke-width="3" />
      <circle cx="40" cy="40" r="5" />
    </g>
    <g transform="translate(190 0)">
      <circle cx="40" cy="120" r="26" fill="none" stroke="#e0e7ff" stroke-width="3" />
      <circle cx="40" cy="120" r="15" fill="none" stroke="#e0e7ff" stroke-width="3" />
      <circle cx="40" cy="120" r="5" />
    </g>
    <g transform="translate(370 20)">
      <circle cx="40" cy="60" r="26" fill="none" stroke="#e0e7ff" stroke-width="3" />
      <circle cx="40" cy="60" r="15" fill="none" stroke="#e0e7ff" stroke-width="3" />
      <circle cx="40" cy="60" r="5" />
    </g>
  </g>
  <g stroke="#e0e7ff" stroke-width="2.5" opacity="0.75" fill="none" stroke-linecap="round">
    <path d="M120 24 L152 24 M136 12 L136 36" />
    <path d="M300 30 L336 30 M318 16 L318 44" />
    <path d="M96 108 q 20 -20 40 0 q 20 20 40 0" />
    <path d="M260 108 q 20 -20 40 0 q 20 20 40 0" />
    <path d="M420 116 q 16 -16 32 0" />
  </g>
  <g fill="#93c5fd" opacity="0.5">
    <rect x="200" y="18" width="10" height="10" rx="2" />
    <rect x="216" y="18" width="10" height="10" rx="2" />
    <rect x="200" y="34" width="10" height="10" rx="2" />
    <rect x="216" y="34" width="10" height="10" rx="2" />
    <rect x="60" y="96" width="10" height="10" rx="2" />
    <rect x="76" y="96" width="10" height="10" rx="2" />
    <rect x="60" y="112" width="10" height="10" rx="2" />
    <rect x="76" y="112" width="10" height="10" rx="2" />
  </g>
</svg>
