<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Stylised illustration of the Osun-Osogbo Sacred Grove: ceremonial white and indigo cloth, brass offerings on a riverbank, and ancient rainforest canopy with warm sunlight filtering through the leaves.">
  <title>Osun-Osogbo Sacred Grove</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="45%" stop-color="#fcd9a4" />
      <stop offset="100%" stop-color="#7fae6a" />
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.16" r="0.55">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="canopyFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="canopyNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f2d1c" />
      <stop offset="100%" stop-color="#241608" />
    </linearGradient>
    <clipPath id="frame">
      <rect width="400" height="400" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="400" height="400" fill="url(#sky)" />
    <rect width="400" height="400" fill="url(#sun)" />

    <!-- Distant canopy wall -->
    <g fill="url(#canopyFar)" opacity="0.9">
      <ellipse cx="52" cy="150" rx="86" ry="52" />
      <ellipse cx="160" cy="132" rx="104" ry="58" />
      <ellipse cx="286" cy="146" rx="92" ry="50" />
      <ellipse cx="372" cy="168" rx="72" ry="44" />
    </g>

    <!-- Far trunks -->
    <g fill="url(#trunk)" opacity="0.75">
      <rect x="26" y="150" width="9" height="86" rx="4" />
      <rect x="86" y="158" width="7" height="78" rx="3" />
      <rect x="212" y="154" width="8" height="82" rx="4" />
      <rect x="306" y="160" width="9" height="76" rx="4" />
      <rect x="366" y="172" width="7" height="64" rx="3" />
    </g>

    <!-- Sacred river -->
    <path d="M0 300 C 70 288, 118 322, 186 306 C 250 291, 306 320, 400 300 L400 400 L0 400 Z" fill="url(#water)" />
    <g stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M18 330 q 34 -10 68 0" />
      <path d="M132 344 q 36 -11 72 0" />
      <path d="M254 328 q 34 -10 68 0" />
      <path d="M74 366 q 34 -10 68 0" />
      <path d="M292 364 q 34 -10 68 0" />
    </g>

    <!-- Riverbank -->
    <path d="M0 288 C 74 276, 120 310, 188 294 C 252 279, 308 308, 400 288 L400 302 C 308 322, 252 293, 188 308 C 120 324, 74 290, 0 302 Z" fill="#a16207" opacity="0.75" />

    <!-- Two worshippers in ceremonial white and indigo -->
    <g>
      <!-- left figure -->
      <path d="M118 246 c 10 0 17 7 18 16 l 4 44 -10 2 -4 -30 -4 30 -10 -2 4 -44 c 1 -9 8 -16 18 -16 z" fill="#f8fafc" />
      <path d="M124 214 a 13 13 0 1 1 0.1 0 z" fill="#5b3a1f" />
      <path d="M112 234 q 16 -12 32 0 l 2 10 q -18 -9 -36 0 z" fill="#1e3a8a" />
      <path d="M128 268 l 6 34 -9 2 -8 -30 z" fill="#f1f5f9" />
      <!-- right figure -->
      <path d="M196 240 c 11 0 19 8 20 18 l 4 48 -11 2 -5 -32 -5 32 -11 -2 5 -48 c 1 -10 9 -18 20 -18 z" fill="#f8fafc" />
      <path d="M203 206 a 14 14 0 1 1 0.1 0 z" fill="#3f2d1c" />
      <path d="M190 228 q 18 -13 36 0 l 2 11 q -20 -10 -40 0 z" fill="#312e81" />
      <path d="M207 266 l 7 36 -10 2 -9 -32 z" fill="#f1f5f9" />
    </g>

    <!-- Brass offering vessels on the bank -->
    <g>
      <path d="M64 292 q 12 -18 24 0 z" fill="#b45309" />
      <rect x="62" y="291" width="28" height="6" rx="3" fill="#d97706" />
      <path d="M298 288 q 10 -15 20 0 z" fill="#b45309" />
      <rect x="296" y="287" width="24" height="6" rx="3" fill="#d97706" />
    </g>

    <!-- Foreground canopy framing the scene -->
    <g fill="url(#canopyNear)">
      <ellipse cx="-6" cy="26" rx="118" ry="70" />
      <ellipse cx="410" cy="8" rx="128" ry="66" />
      <ellipse cx="204" cy="-14" rx="140" ry="52" />
    </g>
    <g fill="url(#trunk)">
      <rect x="8" y="40" width="14" height="120" rx="6" />
      <rect x="378" y="24" width="15" height="128" rx="6" />
    </g>

    <!-- Light shafts through the canopy -->
    <g fill="#fef3c7" opacity="0.18">
      <path d="M300 40 L360 40 L250 400 L150 400 Z" />
      <path d="M250 40 L288 40 L190 400 L120 400 Z" />
    </g>
  </g>
</svg>
